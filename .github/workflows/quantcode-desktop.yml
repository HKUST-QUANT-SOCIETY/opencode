name: QuantCode desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v"
        required: false
        type: string
      publish:
        description: "Publish the installers to a GitHub Release"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "quantcode-v*"

concurrency:
  group: quantcode-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#quantcode-v}"
            publish=true
          else
            version="${INPUT_VERSION:-0.1.${GITHUB_RUN_NUMBER}}"
            publish="${INPUT_PUBLISH:-false}"
          fi

          if [[ "$publish" == "true" && "$GITHUB_REF_TYPE" != "tag" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Publishing is restricted to tags or the default branch ($DEFAULT_BRANCH)" >&2
            exit 1
          fi

          {
            bun packages/desktop/scripts/release-version.ts "$version"
            echo "tag=quantcode-v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Require release credentials
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          QUANTCODE_RELEASE_TOKEN: ${{ secrets.QUANTCODE_RELEASE_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          missing=()
          for name in \
            QUANTCODE_RELEASE_TOKEN \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE \
            AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_PUBLISHER_NAME; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Published QuantCode releases require all signing/release secrets. Missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  build:
    needs: version
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: --mac --x64
            install: --os=darwin --cpu=x64
            signer: apple
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            platform: --mac --arm64
            install: --os=darwin --cpu=arm64
            signer: apple
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: --win --x64
            install: --os=win32 --cpu=x64
            signer: windows
          # Linux packaging is intentionally not part of the current release
          # matrix. Keep the electron-builder Linux target configured for a
          # later, separately validated release.

    env:
      OPENCODE_CHANNEL: quantcode
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
      RUST_TARGET: ${{ matrix.target }}
      # Keep all platform builds reproducible and independent of a live
      # models.dev request. Update the tracked snapshot deliberately when the
      # supported provider catalog changes.
      MODELS_DEV_API_JSON: ${{ github.workspace }}/packages/opencode/test/tool/fixtures/models-api.json
      # Only non-publishing artifact runs may opt into the unsigned updater
      # path. Signed credentials still take precedence in the resolver.
      QUANTCODE_UNSIGNED_BUILD: ${{ needs.version.outputs.publish != 'true' }}
      QUANTCODE_SIGNED_RELEASE: ${{ needs.version.outputs.publish == 'true' }}
      AZURE_CLIENT_ID: ${{ matrix.signer == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_TENANT_ID: ${{ matrix.signer == 'windows' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_SUBSCRIPTION_ID: ${{ matrix.signer == 'windows' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.signer == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ matrix.signer == 'windows' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE || '' }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.signer == 'windows' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ matrix.signer == 'windows' && secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME || '' }}
      APPLE_CERTIFICATE: ${{ matrix.signer == 'apple' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ matrix.signer == 'apple' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_API_KEY_CONTENT: ${{ matrix.signer == 'apple' && secrets.APPLE_API_KEY_CONTENT || '' }}
      APPLE_API_KEY_ID: ${{ matrix.signer == 'apple' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.signer == 'apple' && secrets.APPLE_API_ISSUER || '' }}

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.install }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        with:
          keychain: build
          p12-file-base64: ${{ env.APPLE_CERTIFICATE }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_CONTENT != ''
        shell: bash
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/quantcode-apple-api-key.p8"

      - name: Login for Windows Trusted Signing
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Set desktop version
        working-directory: packages/desktop
        shell: bash
        run: |
          bun -e 'const path="package.json"; const pkg=await Bun.file(path).json(); pkg.version=process.env.OPENCODE_VERSION; await Bun.write(path, JSON.stringify(pkg, null, 2)+"\n")'

      - name: Build QuantCode desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package installers
        working-directory: packages/desktop
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/quantcode-apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && env.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && env.APPLE_API_ISSUER || '' }}
        run: bunx electron-builder ${{ matrix.platform }} --publish never --config electron-builder.config.ts

      - name: Verify installer set
        working-directory: packages/desktop
        shell: bash
        run: |
          case "$RUST_TARGET" in
            aarch64-apple-darwin)
              suffix="mac-arm64"
              expected=(
                "dist/quantcode-$OPENCODE_VERSION-$suffix.dmg"
                "dist/quantcode-$OPENCODE_VERSION-$suffix.dmg.blockmap"
                "dist/quantcode-$OPENCODE_VERSION-$suffix.zip"
                "dist/quantcode-$OPENCODE_VERSION-$suffix.zip.blockmap"
                "dist/latest-mac.yml"
              )
              ;;
            x86_64-apple-darwin)
              suffix="mac-x64"
              expected=(
                "dist/quantcode-$OPENCODE_VERSION-$suffix.dmg"
                "dist/quantcode-$OPENCODE_VERSION-$suffix.dmg.blockmap"
                "dist/quantcode-$OPENCODE_VERSION-$suffix.zip"
                "dist/quantcode-$OPENCODE_VERSION-$suffix.zip.blockmap"
                "dist/latest-mac.yml"
              )
              ;;
            x86_64-pc-windows-msvc)
              suffix="win-x64"
              expected=(
                "dist/quantcode-$OPENCODE_VERSION-$suffix.exe"
                "dist/quantcode-$OPENCODE_VERSION-$suffix.exe.blockmap"
                "dist/latest.yml"
              )
              ;;
            *)
              echo "Unknown release target: $RUST_TARGET" >&2
              exit 1
              ;;
          esac

          for file in "${expected[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty release output: $file" >&2
              exit 1
            fi
          done

      - name: Verify macOS signature
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          found=false
          while IFS= read -r -d '' app; do
            found=true
            codesign --verify --deep --strict --verbose=2 "$app"
            details="$(codesign --display --verbose=4 "$app" 2>&1)"
            grep -q '^Authority=Developer ID Application:' <<< "$details"
            grep -Eq '^TeamIdentifier=.+$' <<< "$details"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done < <(find packages/desktop/dist -maxdepth 2 -name '*.app' -type d -print0)

          if [[ "$found" != "true" ]]; then
            echo "No packaged macOS application was found" >&2
            exit 1
          fi

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $expectedPublisher = $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          $files = @(
            Get-ChildItem "packages\desktop\dist\quantcode-*-win-x64.exe"
            Get-ChildItem "packages\desktop\dist\*-unpacked\QuantCode.exe"
          )
          if ($files.Count -lt 2) {
            throw "Expected the signed NSIS installer and unpacked QuantCode.exe"
          }

          $files | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature for $($_.FullName): $($signature.Status)"
            }
            if ($signature.SignerCertificate.Subject -ne $expectedPublisher) {
              throw "Unexpected publisher for $($_.FullName): $($signature.SignerCertificate.Subject)"
            }
          }

          $updateConfig = Get-ChildItem "packages\desktop\dist\*-unpacked\resources\app-update.yml" | Select-Object -First 1
          if (-not $updateConfig) {
            throw "Packaged app-update.yml was not found"
          }
          $publisherLine = Get-Content $updateConfig.FullName | Where-Object { $_ -match '^publisherName:' } | Select-Object -First 1
          if (-not $publisherLine) {
            throw "app-update.yml does not contain publisherName"
          }
          $configuredPublisher = $publisherLine.Substring($publisherLine.IndexOf(':') + 1).Trim().Trim("'`"")
          if ($configuredPublisher -ne $expectedPublisher) {
            throw "app-update.yml publisherName does not match the signing certificate subject"
          }

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quantcode-${{ matrix.target }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap

      # Keep each target's updater metadata in its own artifact. In particular,
      # both macOS jobs emit `latest-mac.yml`; flattening those files into one
      # release directory makes the last downloaded architecture win.
      - name: Upload updater metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-yml-${{ matrix.target }}
          if-no-files-found: error
          path: packages/desktop/dist/latest*.yml

  release:
    needs:
      - version
      - build
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: quantcode-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: quantcode-*
          path: release-assets
          merge-multiple: true

      # Preserve the target directories expected by finalize-latest-yml.ts.
      # Do not set merge-multiple here: latest-mac.yml is emitted by both
      # macOS architectures and must be merged, not overwritten.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: release-latest-yml

      - name: Validate release assets and finalize updater metadata
        env:
          LATEST_YML_DIR: release-latest-yml
          RELEASE_ASSET_DIR: release-assets
          FINALIZED_YML_DIR: release-finalized
          UPLOAD_RELEASE_METADATA: "false"
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          REQUIRED_TARGETS: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc
        run: bun packages/desktop/scripts/finalize-latest-yml.ts

      - name: Stage draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QUANTCODE_RELEASE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET_REPOSITORY: HKUST-QUANT-SOCIETY/quantcode
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "QUANTCODE_RELEASE_TOKEN is required to publish to $TARGET_REPOSITORY" >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/quantcode-release-notes.md"
          printf 'Built from [%s@%s](https://github.com/%s/commit/%s).\n\nBuild run: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$notes"

          if gh release view "$TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft --jq .isDraft)"
            existing_prerelease="$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to replace published release $TAG" >&2
              exit 1
            fi
            if [[ "$existing_prerelease" != "$PRERELEASE" ]]; then
              echo "Draft prerelease mode does not match the requested version" >&2
              exit 1
            fi
            gh release edit "$TAG" --repo "$TARGET_REPOSITORY" --title "QuantCode $VERSION" --notes-file "$notes"
          else
            target_branch="$(gh repo view "$TARGET_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)"
            flags=(--draft --target "$target_branch")
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" --repo "$TARGET_REPOSITORY" --title "QuantCode $VERSION" --notes-file "$notes" "${flags[@]}"
          fi

          mapfile -t stale < <(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "${stale[@]}"; do
            gh release delete-asset "$TAG" "$asset" --yes --repo "$TARGET_REPOSITORY"
          done

          mapfile -t files < <(find release-assets release-finalized -maxdepth 1 -type f -print | sort)
          gh release upload "$TAG" "${files[@]}" --repo "$TARGET_REPOSITORY"

      - name: Verify staged GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QUANTCODE_RELEASE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_REPOSITORY: HKUST-QUANT-SOCIETY/quantcode
        run: |
          expected="$RUNNER_TEMP/quantcode-release-expected.tsv"
          actual="$RUNNER_TEMP/quantcode-release-actual.tsv"

          while IFS= read -r file; do
            name="$(basename "$file")"
            size="$(stat --format=%s "$file")"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s\t%s\tsha256:%s\n' "$name" "$size" "$digest"
          done < <(find release-assets release-finalized -maxdepth 1 -type f -print | sort) | sort > "$expected"

          gh api "repos/$TARGET_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | [.name, (.size | tostring), (.digest // "")] | @tsv' | sort > "$actual"

          diff --unified "$expected" "$actual"
          [[ "$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]

      - name: Publish verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QUANTCODE_RELEASE_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET_REPOSITORY: HKUST-QUANT-SOCIETY/quantcode
        run: |
          flags=(--draft=false)
          if [[ "$PRERELEASE" != "true" ]]; then flags+=(--latest); fi
          gh release edit "$TAG" --repo "$TARGET_REPOSITORY" "${flags[@]}"
